<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepal KYC Demo</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .box {
      max-width: 420px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0002;
    }

    h1 {
      text-align: center;
    }

    .demo {
      text-align: center;
      color: #b00020;
      font-weight: bold;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #1769aa;
      color: white;
      font-size: 16px;
    }

    .warning {
      margin-top: 20px;
      padding: 12px;
      background: #fff3cd;
      border-radius: 7px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Nepal KYC</h1>

  <div class="demo">DEMO / TEST PAGE</div>

  <form onsubmit="demoSubmit(event)">

    <label>Full Name</label>
    <input type="text" placeholder="Enter your name" required>

    <label>Mobile Number</label>
    <input type="tel" placeholder="+977 98XXXXXXXX" required>

    <label>Bank Name</label>
    <select required>
      <option value="">Select Bank</option>
      <option>Nepal Bank Limited</option>
      <option>Rastriya Banijya Bank</option>
      <option>Nabil Bank</option>
      <option>Global IME Bank</option>
      <option>NIC Asia Bank</option>
      <option>Himalayan Bank</option>
      <option>Everest Bank</option>
      <option>Other</option>
    </select>

    <label>KYC Document</label>
    <select required>
      <option value="">Select Document</option>
      <option>Citizenship</option>
      <option>National ID</option>
      <option>Passport</option>
      <option>Driving License</option>
    </select>

    <button type="submit">Submit Demo</button>

  </form>

  <div class="warning">
    Demo only. Never enter bank password, OTP, PIN, CVV,
    or internet-banking login information.
  </div>

</div>

<script>
function demoSubmit(event) {
  event.preventDefault();
  alert("Demo submitted successfully. No information was sent or stored.");
}
</script>

</body>
</html>
